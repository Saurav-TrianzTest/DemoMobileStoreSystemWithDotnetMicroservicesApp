version: '3.8'

services:
  dmstcont-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dmstcont:latest
    container_name: dmstcont-app
    ports:
      - "80:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - TZ=UTC
      # Database connection (replace with actual values)
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:-Server=host.docker.internal;Database=dmstcont;User Id=sa;Password=YourPassword123;}
      # External service endpoints
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - KAFKA_BROKER=${KAFKA_BROKER:-host.docker.internal:9092}
    volumes:
      - ./logs:/app/logs
      - ./appsettings:/app/appsettings:ro
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  app-network:
    driver: bridge

volumes:
  logs:
  appsettings: